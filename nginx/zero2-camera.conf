server {
    listen __HTTP_PORT__ default_server;
    server_name _;
    return 301 https://$host:__HTTPS_PORT__$request_uri;
}

server {
    listen __HTTPS_PORT__ ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/zero2-camera.crt;
    ssl_certificate_key /etc/nginx/certs/zero2-camera.key;

    auth_basic "Pi Zero 2 WH Camera";
    auth_basic_user_file /etc/nginx/.zero2-camera.htpasswd;

    client_max_body_size 16m;

    location /stream.mjpg {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
